<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <main>
      <div class="card-head">
        <h1 class="card-head-logos">❄️ 🔥</h1>
        <h1 class="card-head-heading">Temp Converter</h1>
        <p class="card-head-subheading">
          slide between hot and cold, instantly
        </p>
      </div>

      <form action="">
        <div class="input-box">
          <label for="input-value">TEMPRETURE</label>
          <input type="number" id="input-value" placeholder="Enter value" />
          <p id="errormsg">Enter coorect value Alphabets and other are not allowed</p>
        </div>

        <div class="field">
          <label class="field-label" id="unitLabel">Unit</label>
          <div
            class="unit-select"
            role="radiogroup"
            aria-labelledby="unitLabel"
          >
            <input type="radio" id="unitC" name="unit" value="C" checked />
            <label for="unitC">°C</label>

            <input type="radio" id="unitF" name="unit" value="F" />
            <label for="unitF">°F</label>

            <input type="radio" id="unitK" name="unit" value="K" />
            <label for="unitK">K</label>
          </div>
        </div>

        <button id="converter">Convert</button>

        <div class="convert-box">

          <div class="convert-value">
              <p>Celcius</p>
            <h3 id="celcius-value">25.00 °C</h3>
          </div>

          <div class="convert-value">
              <p>Farahneit</p>
            <h3 id="farahneit-value">25.00 °F</h3>
          </div>

          <div class="convert-value">
              <p>Kelvin</p>
            <h3 id="kelvin-value">25.00 °K</h3>
          </div>

        </div>
      </form>
    </main>

    <script src="script.js"></script>
  </body>
</html>
